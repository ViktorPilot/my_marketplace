{% extends 'blog/base.html' %}
{% block title %}blog_form{% endblock %}
{% block content %}

{% include 'blog/includes/include_menu.html' %}
<div class="row mx-5 mt-5">
    <div class="col-3">
    </div>
    <div class="col-6">
        <div class="card h-100 text-bg-light text-center mb-5">
            <form method="post" enctype="multipart/form-data" class="mt-5">
                {% csrf_token %}
                {{ form.as_p }}
                <a href="{% url 'blog:home_blog' %}">
                    <button type="button" class="btn btn-primary btn-sm mt-5">Главное меню</button>
                </a>
                <button type="submit" class="btn btn-primary btn-sm mt-5">Сохранить</button>
            </form>
        </div>
    </div>
</div>
<div class="col-3">
</div>
{% endblock %}
