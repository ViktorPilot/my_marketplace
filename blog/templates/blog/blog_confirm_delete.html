{% extends 'blog/base.html' %}
{% load my_tags_blog %}
{% block title %}blog_delete{% endblock %}
{% block content %}

{% include 'blog/includes/include_menu.html' %}
<div class="row mx-5 mt-5">
    <div class="col-2">
    </div>
    <div class="col-8">
        <div class="card h-100">
            <div class="row g-0">
                <div class="col-md-5">
                    <img src="{{ object.image | media_filter }}" class="img-fluid rounded-start" style="height: 28rem"
                         alt="Изображение">
                </div>
                <div class="col-md-7">
                    <div class="card-body"></div>
                    <p class="fs-4 fw-bold">Вы действительно хотите удалить запись <<{{object.title}}>></p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="card-footer bg-transparent border-success"><a
                                href="{% url 'blog:detail_blog' object.pk %}">
                            <button type="button" class="btn btn-primary btn-lg ms-5 mt-5">Отменить</button>
                        </a>
                            <button type="submit" class="btn btn-danger btn-lg ms-5 mt-5">Удалить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="col-2">
    </div>
</div>
{% endblock %}
